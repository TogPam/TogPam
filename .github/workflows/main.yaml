name: Tic-Tac-Toe Game Engine

on:
  issues:
    types: [opened]

jobs:
  play-game:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Game Logic
        run: node play.js "${{ github.event.issue.title }}"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Tic-Tac-Toe board [skip ci]"
          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "Nước đi của bạn đã được ghi nhận! Cảm ơn đã chơi."