name: Tic-Tac-Toe Game Engine

on:
  issues:
    types: [opened]

jobs:
  play-game:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Game Logic
        run: node play.js "${{ github.event.issue.title }}"

      - name: Close Game Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Nước đi của bạn đã được ghi nhận. Hệ thống đang render lại README. Vui lòng quay lại trang chủ sau 10 giây! 🚀"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md state.json
          git commit -m "Auto-update Tic-Tac-Toe board [skip ci]"
          git push
